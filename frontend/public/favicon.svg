<svg 
    viewBox="0 0 100 100" 
    xmlns="http://www.w3.org/2000/svg"
>
    <!-- Solid Cream Base (Never Transparent) -->
    <rect width="100" height="100" fill="#FAF9F6" />
    
    <!-- Crisp White Card with Subtle Accent Border -->
    <rect x="8" y="8" width="84" height="84" rx="20" fill="#FFFFFF" stroke="#2D221B" stroke-opacity="0.08" stroke-width="1.5" />

    <!-- Paw 1 (Top Right) -->
    <g transform="translate(45, 10) scale(0.45)">
        <path 
            d="M50 85C40 85 25 75 25 60C25 45 35 35 50 35C65 35 75 45 75 60C75 75 60 85 50 85Z" 
            fill="#A0522D" 
        />
        <path 
            d="M50 78C44 78 35 72 35 63C35 54 41 50 50 50C59 50 65 54 65 63C65 72 56 78 50 78Z" 
            fill="#4A2614" 
        />
        <circle cx="20" cy="40" r="12" fill="#4A2614" />
        <circle cx="40" cy="22" r="12" fill="#4A2614" />
        <circle cx="68" cy="22" r="12" fill="#4A2614" />
        <circle cx="88" cy="40" r="12" fill="#4A2614" />
    </g>

    <!-- Paw 2 (Bottom Left) -->
    <g transform="translate(5, 45) scale(0.45)">
        <path 
            d="M50 85C40 85 25 75 25 60C25 45 35 35 50 35C65 35 75 45 75 60C75 75 60 85 50 85Z" 
            fill="#A0522D" 
        />
        <path 
            d="M50 78C44 78 35 72 35 63C35 54 41 50 50 50C59 50 65 54 65 63C65 72 56 78 50 78Z" 
            fill="#4A2614" 
        />
        <circle cx="20" cy="40" r="12" fill="#4A2614" />
        <circle cx="40" cy="22" r="12" fill="#4A2614" />
        <circle cx="68" cy="22" r="12" fill="#4A2614" />
        <circle cx="88" cy="40" r="12" fill="#4A2614" />
    </g>
</svg>
